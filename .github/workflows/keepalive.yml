name: Mantener despierta

# Cada 10 minutos llama a /api/internal/tick: evita que Render (plan gratis) duerma la web
# y, de paso, envía los recordatorios de hábitos que toquen.
# Secretos (Settings > Secrets > Actions): APP_URL (https://tu-app.onrender.com) y CRON_TOKEN.
# En un repo privado gasta minutos gratuitos (2000/mes); en uno público es ilimitado.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a la app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_TOKEN" ]; then echo "Faltan secretos"; exit 0; fi
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_TOKEN" "$APP_URL/api/internal/tick"
