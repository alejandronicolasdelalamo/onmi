name: Recordatorios

# Sustituye al cron de pago de Render: revisa y envía los avisos de hábitos que toquen.
# Necesita los secretos DATABASE_URL, VAPID_PUBLIC_KEY y VAPID_PRIVATE_KEY (Settings > Secrets > Actions).
# En un repo privado cada ejecución gasta minutos gratuitos; en uno público es ilimitado.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      SECRET_KEY: reminders
      JWT_SECRET_KEY: reminders
    steps:
      - name: Comprobar secretos
        id: check
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "Faltan secretos; no se envía nada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Enviar recordatorios
        if: steps.check.outputs.skip != 'true'
        working-directory: backend
        run: |
          pip install -r requirements.txt
          flask --app wsgi send-reminders
