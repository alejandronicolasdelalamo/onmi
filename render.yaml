# Blueprint de Render: Docker (frontend + API en un servicio) + PostgreSQL gestionado.
services:
  - type: web
    name: onmi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: onmi-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false # https://<tu-servicio>.onrender.com
      - key: DEMO_ENABLED
        value: "true"
      - key: SENDGRID_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: onmi-db
    plan: free
