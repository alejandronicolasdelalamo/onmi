# Servicio web de Render: Docker (frontend + API en un servicio), plan gratuito.
# La base de datos es PostgreSQL en Neon (DATABASE_URL) y los recordatorios push
# corren en GitHub Actions (.github/workflows/reminders.yml), así que no hay nada de pago.
services:
  - type: web
    name: onmi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # cadena de conexión de Neon
      - key: FRONTEND_URL
        sync: false # https://<tu-servicio>.onrender.com
      - key: DEMO_ENABLED
        value: "true"
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false # remitente verificado en SendGrid
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
